[project]
name = "so101"
version = "0.1.0"
description = "SO-101 arm bring-up, metrology, and follow-on experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "feetech-servo-sdk",   # imports as scservo_sdk
    "pyserial",
    "numpy",
    "scipy",
    "pyyaml",
    "rich",
    "rerun-sdk",
    "pyarrow",
    "matplotlib",
    "mujoco>=3.17.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
