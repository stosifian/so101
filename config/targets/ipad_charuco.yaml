# iPad Air (M1) full-screen ChArUco: intrinsics target + world reference (Phase 2 D1).
# Generated by scripts/camera/make_ipad_charuco.py -> config/targets/ipad_charuco_2360x1640.png.
# Show it full screen in landscape (Photos, UI hidden): the image is exactly the native resolution, so it is drawn 1:1.
dictionary: DICT_6X6_250   # differs from the printed boards (5X5_100) and the AprilTags (36h11): no ID clashes
squares_x: 13
squares_y: 9               # 12 x 8 = 96 inner corners; marker ids 0..57
square_px: 168             # display px (~16.2 mm)
marker_px: 128             # 8 cells (6x6 + border) x 16 px: every cell is whole display pixels
screen_px: [2360, 1640]
offset_px: [88, 64]        # centred; keeps clear of the rounded screen corners
pitch_mm: 0.0962121        # 25.4 / 264 ppi, NOMINAL (Apple rounds ppi); replace after the caliper check (D2/D4)
pitch_measured: false
