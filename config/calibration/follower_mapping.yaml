# Tick -> model joint angle (step 7):  q_rad = sign * (ticks - zero_ticks) * 2*pi / 4096
# Model: models/so101_menagerie (joint zero = LeRobot "middle of range" pose).
# status: measured by eye (each zero = reading with that joint held at its model-0 reference, ~±3-5 deg)
#   reference poses: run 20261027-095547_model_check_follower (2nd zero_lift / zero_elbow used; 1st were
#   mis-records in rest pose). Signs +1: directions confirmed by eye in the live viewer.
#   Then nudged live to line the model up with the arm (run 20261027-101247_model_check_follower,
#   mapping_proposal_101719.json): elbow -6.0 deg, wrist_roll +1.0 deg, gripper -11.0 deg.
# Previous values (2026-10-27 hypothesis = midpoints of the 2026-10-26 hand sweep) kept in comments.
# Known: this unit's stops reach ~7-11 deg beyond the model's nominal ranges (lift ~-107, wrist_flex ~-106
# deg; gripper closed ~-11 deg vs model -10), so the plausibility check uses model range UNION this arm's
# measured range (measured_range_ticks, from the 2026-10-26 hand sweep).
model: models/so101_menagerie/scene.xml
status: verified_by_eye   # 3 mixed validation poses lined up (run 20261027-103553_model_check_follower)
joints:
  shoulder_pan:  {sign: 1, zero_ticks: 2213}   # arm straight forward       (hypothesis 2187, +2.3 deg)
  shoulder_lift: {sign: 1, zero_ticks: 2222}   # upper arm vertical          (hypothesis 2106, +10.2 deg)
  elbow_flex:    {sign: 1, zero_ticks: 1897}   # forearm ⟂ upper arm; ref 1829, nudged -6.0 deg (hypothesis 1822)
  wrist_flex:    {sign: 1, zero_ticks: 2148}   # wrist in line with forearm  (hypothesis 1986, +14.2 deg)
  wrist_roll:    {sign: 1, zero_ticks: 2156}   # matched to the ghost; ref 2167, nudged +1.0 deg (hypothesis 2048)
  gripper:       {sign: 1, zero_ticks: 2172}   # jaws just touching; ref 2047, nudged -11.0 deg (hypothesis 2032)
measured_range_ticks:  # this unit's hand-swept extremes (docs/hardware_log.md, 2026-10-26)
  shoulder_pan:  [919, 3454]
  shoulder_lift: [1003, 3208]
  elbow_flex:    [715, 2928]
  wrist_flex:    [946, 3025]
  wrist_roll:    [291, 3488]
  gripper:       [2032, 3497]
