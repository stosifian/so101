# Follower arm (white), 6x Feetech STS3215 1:345, 12 V supply.
name: follower
port: /dev/cu.usbmodem5B901032551   # CH343 board, USB serial 5B90103255 (verified 2026-10-26 by voltage probe)
baudrate: 1000000
protocol_end: 0                    # STS series
joints:                            # name: servo id
  shoulder_pan: 1
  shoulder_lift: 2
  elbow_flex: 3
  wrist_flex: 4
  wrist_roll: 5
  gripper: 6
expected_voltage_v: [11.0, 13.0]
# Software joint limits (enforced by SafeArm; no firmware limits are set). Swept range minus a
# 50-tick margin (~4.4 deg) each end. By-hand torque-off sweep 20261026-130808_telemetry_follower, approved 2026-10-26.
# Rest pose is outside two of these (elbow_flex 2927, gripper ~2045): SafeArm must allow
# moves back toward the range, never clamp-jump.
limits_ticks:        # [min, max]      swept range
  shoulder_pan:  [969, 3404]     # 919..3454
  shoulder_lift: [1053, 3158]    # 1003..3208
  elbow_flex:    [765, 2878]     # 715..2928
  wrist_flex:    [996, 2975]     # 946..3025
  wrist_roll:    [341, 3438]     # 291..3488
  gripper:       [2082, 3447]    # 2032..3497
# SafeArm settings (step 4, approved 2026-10-26). Conservative; relax with step 6 data.
# Voltage trip uses expected_voltage_v above.
safety:
  speed_cap_ticks_s: 200       # Goal_Speed, ~18 deg/s
  accel_cap: 10                # Acceleration register, x100 ticks/s^2 = 1000 ticks/s^2
  max_step_ticks: 100          # goal clamped to present +/- this per command (~9 deg)
  temp_trip_c: 55              # firmware unloads at 70
  load_trip_pct: 50            # |Present_Load| above this ...
  load_trip_s: 0.5             # ... for this long
  debounce_s: 0.5              # temp/voltage must be out of range this long (ADC glitches, step 3)
  comm_fail_trip: 5            # consecutive snapshots with a failed servo
  torque_check_s: 0.5          # how often Torque_Enable is re-read while enabled
  enable_drift_tol_ticks: 20   # max present-position change during the enable sequence
