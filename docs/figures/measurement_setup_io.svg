<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Measurement setup: the Mac triggers the camera and downloads RAW photos over USB, and commands the follower arm's servos over a USB-serial bus board; the camera sees the iPad reference board and the AprilTag on the gripper.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6fdb"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#ffffff"/>

  <!-- Mac -->
  <rect x="30" y="170" width="230" height="170" rx="8" fill="#eef3fc" stroke="#333" stroke-width="1.5"/>
  <text x="145" y="198" text-anchor="middle" font-weight="bold" font-size="15">MacBook Pro (M1 Pro)</text>
  <text x="48" y="228">capture: gphoto2 tether</text>
  <text x="48" y="250">pose: tag rel. iPad per photo</text>
  <text x="48" y="272">control: SafeArm, 100 Hz loop</text>
  <text x="48" y="294">log: parquet (host clock)</text>
  <text x="48" y="316">live: Rerun / TUI</text>

  <!-- Camera -->
  <rect x="370" y="40" width="210" height="80" rx="8" fill="#f6f7f9" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="68" text-anchor="middle" font-weight="bold" font-size="15">Sony A7 IV</text>
  <text x="475" y="90" text-anchor="middle">35 mm, f/11, ~0.65 m away</text>
  <text x="475" y="108" text-anchor="middle">RAW, ~6 s per shot</text>

  <!-- Bus board -->
  <rect x="370" y="330" width="210" height="80" rx="8" fill="#f6f7f9" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="358" text-anchor="middle" font-weight="bold" font-size="15">Servo bus board</text>
  <text x="475" y="380" text-anchor="middle">CH343 USB-serial</text>
  <text x="475" y="398" text-anchor="middle">1 Mbps, half-duplex</text>

  <!-- PSU -->
  <rect x="400" y="460" width="150" height="50" rx="8" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/>
  <text x="475" y="490" text-anchor="middle" font-weight="bold">12 V supply</text>

  <!-- iPad -->
  <rect x="660" y="130" width="210" height="80" rx="8" fill="#f6f7f9" stroke="#333" stroke-width="1.5"/>
  <text x="765" y="158" text-anchor="middle" font-weight="bold" font-size="15">iPad</text>
  <text x="765" y="180" text-anchor="middle">ChArUco board on screen</text>
  <text x="765" y="198" text-anchor="middle">fixed reference, no data link</text>

  <!-- Follower -->
  <rect x="660" y="300" width="210" height="140" rx="8" fill="#f6f7f9" stroke="#333" stroke-width="1.5"/>
  <text x="765" y="328" text-anchor="middle" font-weight="bold" font-size="15">SO-101 follower</text>
  <text x="765" y="352" text-anchor="middle">6 × STS3215 servos (IDs 1–6)</text>
  <text x="765" y="372" text-anchor="middle">daisy-chained on one bus</text>
  <text x="765" y="392" text-anchor="middle">12-bit encoders (4096 ticks/rev)</text>
  <rect x="712" y="408" width="106" height="22" rx="4" fill="#ffffff" stroke="#2a6fdb" stroke-width="1.2"/>
  <text x="765" y="424" text-anchor="middle" fill="#2a6fdb">20 mm AprilTag</text>
  <text x="700" y="290" font-size="12" fill="#2a6fdb">tag on gripper</text>

  <!-- Mac <-> camera -->
  <polyline points="260,210 310,210 310,80 368,80" fill="none" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="318" y="134" font-size="12">USB (PTP)</text>
  <text x="318" y="150" font-size="12" fill="#555">trigger →</text>
  <text x="318" y="166" font-size="12" fill="#555">← RAW files</text>

  <!-- Mac <-> bus board -->
  <polyline points="260,300 310,300 310,370 368,370" fill="none" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="138" y="368" font-size="12">USB serial</text>
  <text x="138" y="384" font-size="12" fill="#555">goals, speed caps →</text>
  <text x="138" y="400" font-size="12" fill="#555">← position, load, °C, V</text>

  <!-- bus board <-> follower -->
  <line x1="580" y1="370" x2="658" y2="370" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="619" y="360" text-anchor="middle" font-size="12">servo bus</text>

  <!-- PSU -> bus board, bus power to follower -->
  <line x1="475" y1="460" x2="475" y2="412" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="483" y="442" font-size="12" fill="#c0392b">12 V</text>
  <line x1="580" y1="390" x2="658" y2="390" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="619" y="406" text-anchor="middle" font-size="12" fill="#c0392b">12 V</text>

  <!-- Optical: camera sees iPad and tag -->
  <line x1="580" y1="95" x2="658" y2="160" stroke="#2a6fdb" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <line x1="555" y1="120" x2="690" y2="297" stroke="#2a6fdb" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="600" y="62" font-size="12" fill="#2a6fdb">sees iPad + tag in every photo</text>

  <!-- Legend -->
  <g font-size="12">
    <line x1="30" y1="470" x2="62" y2="470" stroke="#333" stroke-width="1.6"/>
    <text x="70" y="474">data cable</text>
    <line x1="30" y1="492" x2="62" y2="492" stroke="#c0392b" stroke-width="1.6"/>
    <text x="70" y="496" fill="#c0392b">power</text>
    <line x1="30" y1="514" x2="62" y2="514" stroke="#2a6fdb" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="70" y="518" fill="#2a6fdb">line of sight</text>
  </g>
</svg>
